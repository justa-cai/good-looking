name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；排队中的旧任务直接取消，但不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 仓库名与 vite.config.ts 的 base 必须一致，否则线上资源全部 404。
      # 这个错误在本地 dev 下看不出来，只有部署后才会暴露，所以在这里挡住。
      - name: Verify base path
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          if ! grep -q "=\"${BASE}assets/" dist/index.html; then
            echo "::error::dist/index.html 里的资源路径不是 ${BASE}assets/，请检查 vite.config.ts 的 base"
            grep -o 'src="[^"]*"' dist/index.html || true
            exit 1
          fi
          echo "base path OK: ${BASE}"

      # 路线 B 的模型是同源发布的（public/models/，54 MB）。
      # 漏掉它不会有任何构建报错，只会在用户点开页面时静默掉到镜像 ——
      # 而镜像默认是空的，最后的表现就是「模型加载失败」。
      # 这种「构建全绿但功能废掉」的错误必须在这里挡住。
      - name: Verify model asset
        run: |
          MODEL="dist/models/attractive.int4.onnx"
          if [ ! -f "$MODEL" ]; then
            echo "::error::$MODEL 不存在。确认 public/models/attractive.int4.onnx 已提交，"
            echo "::error::并且 .gitignore 里那条 !public/models/attractive.int4.onnx 还在。"
            ls -la dist/ || true
            exit 1
          fi
          SIZE=$(stat -c%s "$MODEL")
          echo "模型：$((SIZE / 1024 / 1024)) MB"
          # 量化后再怎么变也不该低于 20 MB（那说明文件被截断了）；
          # 上限按 GitHub 的硬限制 100 MB 留出余量。
          if [ "$SIZE" -lt 20000000 ] || [ "$SIZE" -gt 90000000 ]; then
            echo "::error::模型体积 $SIZE 字节不在预期范围内（20-90 MB），先确认文件是不是完整的"
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
